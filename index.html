const sc=(c,t)=>{const s=ST[c+"/"+t];return s?`<span class="sc"><b class="o">⭕${s.o}</b> <b class="x">❌${s.x}</b></span>`:""};
const starB=(c,i)=>`<button class="star ${F[c+"/"+D[c][i][0]]?"on":""}" title="お気に入り" onclick="fav('${c}',${i})">★</button>`;
function fav(c,i){const k=c+"/"+D[c][i][0];F[k]?delete F[k]:F[k]=1;saveF();const y=window.scrollY;render();window.scrollTo(0,y)}
const kk=(i)=>S.cat+"/"+D[S.cat][i][0];
let S={cat:"公民",mode:"list",hide:false,q:"",R:new Set(),FR:new Set(),deck:[],i:0,flip:false,qz:null};
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function setCat(c){S.cat=c;S.R=new Set();S.q="";startMode()}
function setMode(m){S.mode=m;startMode()}
function startMode(){
 if(S.mode=="card"){S.deck=shuf(D[S.cat].map((_,i)=>i).filter(i=>!K[kk(i)]));S.i=0;S.flip=false}
 if(S.mode=="quiz")newQuiz();
 render()}
function render(){
 document.documentElement.style.setProperty("--ac",COL[S.cat]);
 $("cats").innerHTML=Object.keys(D).map(c=>{const n=D[c].filter(w=>K[c+"/"+w[0]]).length;
  return `<button class="${c==S.cat?"on":""}" style="--ac:${COL[c]}" onclick="setCat('${c}')">${c}<small>${n}/${D[c].length}語</small></button>`}).join("");
 $("modes").innerHTML=[["list","一覧"],["card","暗記カード"],["quiz","4択クイズ"],["stats","📊成績"],["fav","★お気に入り"]].map(([m,t])=>`<button class="${m==S.mode?"on":""}" onclick="setMode('${m}')">${t}</button>`).join("");
 const b=$("body");
 if(S.mode=="list"){
  b.innerHTML=`<div class="card"><input type="search" id="q" placeholder="🔍 ${S.cat}の単語を検索" value="${esc(S.q)}" oninput="S.q=this.value;drawList()">
  <label class="sub" style="display:block;margin:8px 0 0"><input type="checkbox" ${S.hide?"checked":""} onchange="S.hide=this.checked;S.R=new Set();drawList()"> 意味を隠す(タップで表示)</label><div id="list"></div></div>`;drawList()}
 else if(S.mode=="card")drawCard();
 else if(S.mode=="quiz")drawQuiz();
 else if(S.mode=="stats")drawStats();
 else drawFav();
}
function drawList(){
 const q=S.q.trim();let h="";
 D[S.cat].forEach((w,i)=>{if(q&&!(w[0]+w[1]).includes(q))return;
  const hid=S.hide&&!S.R.has(i);
  h+=`<div class="row ${K[kk(i)]?"k":""}"><div class="t">${esc(w[0])}${sc(S.cat,w[0])}</div><div class="m ${hid?"h":""}" onclick="S.R.add(${i});drawList()">${esc(w[1])}</div>${starB(S.cat,i)}<button class="mk" onclick="mk(${i})">${K[kk(i)]?"✓覚えた":"覚えた"}</button></div>`});
 $("list").innerHTML=h||'<p class="sub">見つかりませんでした</p>';}
function mk(i){const k=kk(i);if(K[k])delete K[k];else K[k]=1;save();
 const y=window.scrollY;render();window.scrollTo(0,y)}
function drawCard(){
 const b=$("body");
 if(S.i>=S.deck.length){b.innerHTML=`<div class="card" style="text-align:center"><p style="font-size:18px">🎉 ${S.deck.length?"1周しました!":"すべて覚えました!"}</p><p class="sub">「まだ」の単語は次の周回でも出ます。</p><div class="btns"><button class="pri" onclick="setMode('card')">もう一度</button><button onclick="resetK()">覚えた印をリセット</button></div></div>`;return}
 const w=D[S.cat][S.deck[S.i]];
 b.innerHTML=`<p class="sub" style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 0"><span>${sc(S.cat,w[0])}</span><span>${S.i+1} / ${S.deck.length}(未習得のみ) ${starB(S.cat,S.deck[S.i])}</span></p>
 <div class="card big ${S.flip?"b":""}" onclick="S.flip=!S.flip;drawCard()">${S.flip?esc(w[1]):esc(w[0])}</div>
 <p class="sub" style="text-align:center">タップで${S.flip?"用語":"意味"}を表示</p>
 <div class="btns"><button onclick="nextCard(0)">まだ</button><button class="pri" onclick="nextCard(1)">覚えた</button></div>`}
function nextCard(ok){rec(S.cat,D[S.cat][S.deck[S.i]][0],ok);if(ok){K[kk(S.deck[S.i])]=1;save()}S.i++;S.flip=false;render()}
function resetK(){for(const k in K)if(k.startsWith(S.cat+"/"))delete K[k];save();setMode("card")}
const STOP="のをはがにでと・ー";
function sim(a,b){let n=0;for(const ch of new Set(a))if(!STOP.includes(ch)&&b.includes(ch))n++;return n}
function pickOpts(c,i){
 const all=D[c],t=all[i][0];let pick=[];
 const cl=CM[t]||[];
 if(cl.length)pick=shuf(cl[Math.random()*cl.length|0].filter(x=>x!=t)).slice(0,3);
 if(pick.length<3){
  const gs=GM[t]||[];
  const pool=gs.length?gs[Math.random()*gs.length|0].filter(x=>x!=t&&!pick.includes(x)):[];
  const sc=pool.map(x=>[x,sim(t,x)+Math.random()*0.9]).sort((p,q)=>q[1]-p[1]).map(p=>p[0]);
  pick=pick.concat(sc.slice(0,3-pick.length))}
 if(pick.length<3){const rest=shuf(all.map(w=>w[0]).filter(x=>x!=t&&!pick.includes(x)));pick=pick.concat(rest.slice(0,3-pick.length))}
 return shuf([t,...pick])}
function newQuiz(){
 const all=D[S.cat];const idx=shuf(all.map((_,i)=>i)).slice(0,10);
 S.qz={n:0,sc:0,w:0,ans:null,items:idx.map(i=>({i,o:pickOpts(S.cat,i)}))}}
function drawQuiz(){
 const z=S.qz,b=$("body");
 if(z.n>=z.items.length){b.innerHTML=`<div class="card" style="text-align:center"><p class="sub">${S.cat}クイズ結果</p><p style="font-size:34px;font-weight:bold;margin:4px">${z.sc} / ${z.items.length}</p><p>${z.sc>=9?"すばらしい!":z.sc>=7?"よくできました!":"もう一度挑戦しよう!"}</p><button class="opt pri" style="text-align:center" onclick="setMode('quiz')">もう一度</button></div>`;return}
 const it=z.items[z.n],all=D[S.cat];
 b.innerHTML=`<div class="card"><p class="sub" style="margin:0;display:flex;justify-content:space-between"><span>第${z.n+1}問 / ${z.items.length}</span><span><b style="color:var(--ok)">⭕${z.sc}</b>　<b style="color:var(--ng)">❌${z.w}</b></span></p><p style="font-size:17px;margin:8px 0">次の説明にあてはまる用語は?</p><p style="font-size:18px;font-weight:bold;margin:0 0 6px">${esc(all[it.i][1])}</p>
 ${it.o.map((t,k)=>{let c="";if(z.ans!==null){if(t==all[it.i][0])c="ok";else if(k==z.ans)c="ng"}return `<button class="opt ${c}" ${z.ans!==null?"disabled":""} onclick="ans(${k})">${esc(t)}</button>`}).join("")}
 ${z.ans!==null?`<p style="margin:10px 0 0;display:flex;justify-content:space-between;align-items:center"><span>${it.o[z.ans]==all[it.i][0]?"⭕ 正解!":"❌ 正解は「"+esc(all[it.i][0])+"」"}</span>${starB(S.cat,it.i)}</p><button class="opt pri" style="text-align:center" onclick="S.qz.n++;S.qz.ans=null;drawQuiz()">${z.n==9?"結果を見る":"次へ"}</button>`:""}</div>`}
function ans(k){const z=S.qz,it=z.items[z.n],i=it.i,ok=it.o[k]==D[S.cat][i][0];z.ans=k;ok?z.sc++:z.w++;rec(S.cat,D[S.cat][i][0],ok);drawQuiz()}
function drawStats(){
 const rows=D[S.cat].map((w,i)=>({w,i,s:ST[S.cat+"/"+w[0]]||{o:0,x:0}}));
 const O=rows.reduce((a,r)=>a+r.s.o,0),X=rows.reduce((a,r)=>a+r.s.x,0),T=O+X,P=T?Math.round(O/T*100):0;
 const tried=rows.filter(r=>r.s.o+r.s.x>0).length;
 const weak=rows.filter(r=>r.s.x>0).sort((a,b)=>b.s.x-a.s.x||a.s.o-b.s.o).slice(0,15);
 $("body").innerHTML=`<div class="card"><h2>${S.cat}の成績</h2>
 <div class="sum"><div class="o"><b>${O}</b>正解</div><div class="x"><b>${X}</b>不正解</div><div><b>${T?P+"%":"-"}</b>正答率</div></div>
 ${T?`<div class="bar"><i style="width:${P}%"></i></div>`:'<p class="sub">まだ記録がありません。クイズや暗記カードに挑戦しましょう。</p>'}
 <p class="sub" style="margin:0">挑戦した単語 ${tried} / ${rows.length}語 ・ 暗記カードの「覚えた」は正解、「まだ」は不正解として数えます。</p></div>
 <div class="card"><h2>🔥 まちがいの多い単語</h2>${weak.length?weak.map(r=>`<div class="row"><div class="t">${esc(r.w[0])}${sc(S.cat,r.w[0])}</div><div class="m">${esc(r.w[1])}</div>${starB(S.cat,r.i)}</div>`).join(""):'<p class="sub">まちがえた単語はまだありません。</p>'}</div>
 ${T?`<div class="btns"><button onclick="resetS()">${S.cat}の成績をリセット</button></div>`:""}`}
function resetS(){if(!confirm(S.cat+"の成績を消しますか?"))return;for(const k in ST)if(k.startsWith(S.cat+"/"))delete ST[k];saveS();render()}
function drawFav(){
 let n=0,h="";
 for(const c in D){let r="";D[c].forEach((w,i)=>{if(!F[c+"/"+w[0]])return;n++;const k=c+"/"+w[0],hid=S.hide&&!S.FR.has(k);
  r+=`<div class="row"><div class="t">${esc(w[0])}${sc(c,w[0])}</div><div class="m ${hid?"h":""}" onclick="S.FR.add('${k}');drawFav()">${esc(w[1])}</div>${starB(c,i)}</div>`});
  if(r)h+=`<h2 style="color:${COL[c]};margin-top:12px">${c}</h2>${r}`}
 $("body").innerHTML=`<div class="card"><h2>★ お気に入り(${n}語)</h2>${n?`<label class="sub" style="display:block;margin:4px 0 0"><input type="checkbox" ${S.hide?"checked":""} onchange="S.hide=this.checked;S.FR=new Set();S.R=new Set();drawFav()"> 意味を隠す(タップで表示)</label>${h}`:'<p class="sub">一覧・暗記カード・クイズの ★ を押すと、ここに集まります。</p>'}</div>`}
render();
</script></body></html>
